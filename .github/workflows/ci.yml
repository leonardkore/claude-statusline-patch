name: ci

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - refactor/**
      - docs/**
      - chore/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
